<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rubik's Cube</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            color: #ffffff;
        }
        p {
            margin: 0 0 5px 0;
            font-size: 14px;
            color: #cccccc;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            pointer-events: none;
        }
        .control-group {
            margin-bottom: 10px;
        }
        .control-label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #aaa;
        }
        button {
            background: #333;
            color: white;
            border: 1px solid #666;
            padding: 8px 16px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.2s;
        }
        button:hover {
            background: #444;
            border-color: #888;
        }
        button:active {
            background: #555;
        }
        .scramble-btn {
            background: #e74c3c;
            border-color: #c0392b;
            margin-top: 10px;
        }
        .scramble-btn:hover {
            background: #c0392b;
        }
        .reset-btn {
            background: #3498db;
            border-color: #2980b9;
        }
        .reset-btn:hover {
            background: #2980b9;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: white;
            pointer-events: none;
            text-align: right;
        }
        .key-hint {
            display: inline-block;
            background: #333;
            color: white;
            padding: 2px 6px;
            margin: 0 2px;
            border-radius: 3px;
            font-size: 12px;
            border: 1px solid #666;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui">
        <h1>3D Rubik's Cube</h1>
        <p>Solve the cube by rotating faces</p>
    </div>
    <div id="controls">
        <div class="control-group">
            <span class="control-label">Controls</span>
            <button class="reset-btn">Reset Cube</button>
            <button class="scramble-btn">Scramble</button>
        </div>
    </div>
    <div id="instructions">
        <div><strong>Keyboard:</strong></div>
        <div><span class="key-hint">Q/W</span> Up face • <span class="key-hint">A/S</span> Down face</div>
        <div><span class="key-hint">E/D</span> Right face • <span class="key-hint">Z/X</span> Left face</div>
        <div><span class="key-hint">R/F</span> Front face • <span class="key-hint">T/Y</span> Back face</div>
        <div><span class="key-hint">Arrow keys</span> Rotate view • <span class="key-hint">Space</span> Pause/Resume</div>
    </div>

    <!-- Import map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { Cube } from './Cube.js';
        import { Controls } from './Controls.js';
        import { Animation } from './Animation.js';
        import { Materials } from './Materials.js';

        // Initialize scene, camera, renderer
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Add lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        // Create controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 5;
        controls.maxDistance = 20;

        // Initialize materials
        const materials = new Materials();

        // Create cube
        const rubiksCube = new Cube(materials);

        // Set up input controls
        const inputControls = new Controls();

        // Set up animation
        const animation = new Animation(rubiksCube, inputControls);

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation loop
        let lastTime = 0;
        function animate(time = 0) {
            const deltaTime = time - lastTime;
            lastTime = time;

            animation.update(deltaTime);

            controls.update();
            renderer.render(scene, camera);

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
